<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>四宫格图标 · 设计稿 vs 实际 SVG 对照</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { padding: 40px; background: #efeae0; font-family: "Noto Sans SC", sans-serif; color: #243447; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.desc { font-size: 13px; color: #7a7568; margin-bottom: 28px; }
  .wrap { display: flex; gap: 48px; flex-wrap: wrap; }
  .panel { background: #f8f4ea; border-radius: 16px; padding: 24px; }
  .panel h2 { font-size: 13px; font-weight: 700; margin-bottom: 16px; letter-spacing: .5px; }
  .panel h2 .badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
  .badge.old { background: #ded8ca; color: #6b6558; }
  .badge.new { background: #c94a4a; color: #fff8ec; }
  .row { display: flex; gap: 8px; }
  .cat { display: flex; flex-direction: column; align-items: center; width: 84px; padding: 12px 4px 9px; border-radius: 15px; background: #fffdf8; border: .5px solid rgba(36,52,71,.06); }
  .mark { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; background: #e6ecf1; }
  .mark.accent { background: #f1e6d8; }
  .mark svg { width: 19px; height: 19px; }
  .name { margin-top: 6px; font-size: 11.5px; font-weight: 500; }
  /* 放大观察 */
  .zoom { display: flex; gap: 24px; margin-top: 28px; padding-top: 24px; border-top: 1px dashed rgba(36,52,71,.15); }
  .zoom .item { text-align: center; }
  .zoom .box { display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 16px; background: #e6ecf1; margin-bottom: 8px; }
  .zoom .box.accent { background: #f1e6d8; }
  .zoom .box svg { width: 56px; height: 56px; }
  .zoom span { font-size: 11px; color: #7a7568; }
</style>
</head>
<body>

<h1>四宫格图标对照</h1>
<p class="desc">左：原有 SVG（未按设计稿） / 右：按设计稿重绘的实际文件（18×18 viewBox，36rpx 显示，与设计稿 19px@393 等比一致）</p>

<div class="wrap">

  <div class="panel">
    <h2>改动前<span class="badge old">原有 icon-6/10/2/1</span></h2>
    <div class="row">
      <div class="cat">
        <div class="mark"><svg viewBox="0 0 17.9939 17.9939" fill="none" stroke="#3D5A73" stroke-width="1.12462" stroke-linecap="round" stroke-linejoin="round"><path d="M3.44883 3.59878H6.97264C7.46138 3.59339 7.93558 3.76502 8.30765 4.08198C8.67973 4.39893 8.92457 4.83981 8.99695 5.3232C9.06933 4.83981 9.31417 4.39893 9.68625 4.08198C10.0583 3.76502 10.5325 3.59339 11.0213 3.59878H14.5451V12.8956H11.0213C10.5325 12.8902 10.0583 13.0619 9.68625 13.3788C9.31417 13.6958 9.06933 14.1367 8.99695 14.62C8.92457 14.1367 8.67973 13.6958 8.30765 13.3788C7.93558 13.0619 7.46138 12.8902 6.97264 12.8956H3.44883V3.59878Z" stroke="#3D5A73" stroke-width="1.12462" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.99695 5.3232V14.62" stroke="#3D5A73" stroke-width="1.12462" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="name">诗词学习</span>
      </div>
      <div class="cat">
        <div class="mark"><svg viewBox="0 0 17.9939 17.9939" fill="none"><rect x="4.87335" y="3.37386" width="8.24725" height="11.24614" stroke="#3D5A73" stroke-width="1.12462" stroke-linejoin="round"/><path d="M7.12259 6.74771H10.8713M7.12259 9.37182H10.8713M7.12259 11.9959H9.37182" stroke="#3D5A73" stroke-width="1.12462" stroke-linecap="round"/></svg></div>
        <span class="name">记忆训练</span>
      </div>
      <div class="cat">
        <div class="mark"><svg viewBox="0 0 17.9939 17.9939" fill="none"><path d="M4.79837 7.19756L8.99695 11.0962L13.1955 7.19756" stroke="#3D5A73" stroke-width="1.12462" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span class="name">诗词库</span>
      </div>
      <div class="cat">
        <div class="mark accent"><svg viewBox="0 0 17.9939 17.9939" fill="none"><circle cx="8.99695" cy="8.99695" r="5.848" stroke="#A97A3E" stroke-width="1.12462"/><path d="M8.99695 5.54812V8.99695L11.3961 10.4964" stroke="#A97A3E" stroke-width="1.12462" stroke-linecap="round"/></svg></div>
        <span class="name">学习计划</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>改动后<span class="badge new">按设计稿重绘</span></h2>
    <div class="row">
      <div class="cat">
        <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#3D5A73" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><path d="M2.7 3.3h4.5a2.4 2.4 0 0 1 2.4 2.4v8.9a1.7 1.7 0 0 0-1.7-1.7H2.7z"/><path d="M15.3 3.3h-2.1a2.4 2.4 0 0 0-2.4 2.4v8.9a1.7 1.7 0 0 1 1.7-1.7h2.8z"/></svg></div>
        <span class="name">诗词学习</span>
      </div>
      <div class="cat">
        <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#3D5A73" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="1.6"/><path d="M6 6.8h6M6 9.6h6M6 12.4h3.6"/></svg></div>
        <span class="name">记忆训练</span>
      </div>
      <div class="cat">
        <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#3D5A73" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5C7.5 3.4 5.6 3 3.8 3v10.5c1.8 0 3.7.4 5.2 1.5 1.5-1.1 3.4-1.5 5.2-1.5V3c-1.8 0-3.7.4-5.2 1.5z"/><path d="M9 4.5V15"/></svg></div>
        <span class="name">诗词库</span>
      </div>
      <div class="cat">
        <div class="mark accent"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#A97A3E" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.8" width="12" height="11.2" rx="1.6"/><path d="M6 2.2v3M12 2.2v3M3 7.5h12"/></svg></div>
        <span class="name">学习计划</span>
      </div>
    </div>

    <div class="zoom">
      <div class="item">
        <div class="box"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#3D5A73" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><path d="M2.7 3.3h4.5a2.4 2.4 0 0 1 2.4 2.4v8.9a1.7 1.7 0 0 0-1.7-1.7H2.7z"/><path d="M15.3 3.3h-2.1a2.4 2.4 0 0 0-2.4 2.4v8.9a1.7 1.7 0 0 1 1.7-1.7h2.8z"/></svg></div>
        <span>icon-6-ink</span>
      </div>
      <div class="item">
        <div class="box"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#3D5A73" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="12" rx="1.6"/><path d="M6 6.8h6M6 9.6h6M6 12.4h3.6"/></svg></div>
        <span>icon-10-ink</span>
      </div>
      <div class="item">
        <div class="box"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#3D5A73" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5C7.5 3.4 5.6 3 3.8 3v10.5c1.8 0 3.7.4 5.2 1.5 1.5-1.1 3.4-1.5 5.2-1.5V3c-1.8 0-3.7.4-5.2 1.5z"/><path d="M9 4.5V15"/></svg></div>
        <span>icon-2-ink</span>
      </div>
      <div class="item">
        <div class="box accent"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" fill="none" stroke="#A97A3E" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.8" width="12" height="11.2" rx="1.6"/><path d="M6 2.2v3M12 2.2v3M3 7.5h12"/></svg></div>
        <span>icon-1-ink</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
