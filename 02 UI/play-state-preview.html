<!doctype html><meta charset="utf-8">
<style>
:root{--paper:#f8f4ea;--paper-card:#fffdf8;--ink:#243447;--ink-card:#243f4b;--ink-3:#959b94;--cinnabar:#c94a4a;--line-faint:rgba(36,52,71,.06)}
body{margin:0;padding:32px;background:#e9e4d8;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;color:var(--ink)}
.wrap{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.col{width:306px}
.lab{font-size:12px;font-weight:500;color:#2C2C2A;margin-bottom:3px}
.sub{font-size:11px;color:#888780;margin-bottom:10px}
.card{background:var(--paper);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;min-height:64px;padding:9px 11px;box-sizing:border-box;border-radius:16px;background:var(--paper-card);border:1px solid var(--line-faint)}
.main{flex:1;min-width:0}
.tline{display:flex;align-items:baseline}
.title{font-family:'Noto Serif SC','Songti SC',serif;font-size:13px;font-weight:700;letter-spacing:.04em}
.author{font-size:10px;color:var(--ink-3)}
.count{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--ink-3);font-size:10px}
.count .mini{width:11px;height:11px;display:block}
.count .mini svg{display:block;width:100%;height:100%}
.btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--ink-card)}
.btn.on{background:var(--cinnabar)}
.ico{display:flex;align-items:center;justify-content:center}
.box-26{width:13px;height:13px}
.box-34{width:17px;height:17px}
.ico svg{display:block;width:100%;height:100%}
.zoomwrap{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin-top:26px;align-items:flex-end}
.zoom{background:var(--paper);border-radius:16px;padding:16px 22px 14px;text-align:center}
.pair{display:flex;gap:18px;justify-content:center}
.pair .btn{width:90px;height:90px}
.pair .box-26{width:39px;height:39px}
.pair .box-34{width:51px;height:51px}
.zoom .cap{font-size:11px;color:#888780;margin-top:10px}
</style>
